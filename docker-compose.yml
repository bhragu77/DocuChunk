services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - APP_ENV=development
      - UPLOAD_DIR=/app/uploads
      # Vector store runs as a shared server (see the `chroma` service). The app and
      # worker are HTTP CLIENTS of it — they must NOT open a PersistentClient on the
      # shared data dir (two processes on one embedded Chroma dir race the HNSW
      # segment → intermittent "Error executing plan: ... Error finding id" 500s).
      - CHROMA_MODE=http
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      # Still set: BM25Index persists per-user pickles under this dir (app/main.py).
      - CHROMA_PERSIST_DIR=/app/chroma_db
      - DATABASE_URL=sqlite:////app/data/app.db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - uploads_data:/app/uploads
      - chroma_data:/app/chroma_db
      - sqlite_data:/app/data
    depends_on:
      - redis
      - chroma
    restart: unless-stopped

  # arq worker — runs the document pipeline in a SEPARATE process from the web app,
  # against the SAME image and the SAME volumes (it re-fetches state from the DB by
  # doc_id and reads the uploaded files off the shared uploads volume).
  worker:
    build: .
    command: arq app.worker.WorkerSettings
    env_file:
      - .env
    environment:
      - APP_ENV=development
      - UPLOAD_DIR=/app/uploads
      # Same HTTP-client config as the app: both talk to the one `chroma` server so
      # the worker's embedding writes and the app's reads never share an embedded
      # PersistentClient dir. This is the fix for the concurrent-write races.
      - CHROMA_MODE=http
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - CHROMA_PERSIST_DIR=/app/chroma_db
      - DATABASE_URL=sqlite:////app/data/app.db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - uploads_data:/app/uploads
      - chroma_data:/app/chroma_db
      - sqlite_data:/app/data
    depends_on:
      - redis
      - chroma
    restart: unless-stopped

  # Vector store server — the SINGLE process that owns the Chroma data files. The
  # app + worker connect to it over the compose network (CHROMA_MODE=http). Pinned
  # to 1.5.9 to match the `chromadb` client version installed in the app image.
  # It mounts the SAME chroma_data volume the app used to open directly, so existing
  # embeddings carry over unchanged (server persist path /data == the volume root).
  chroma:
    image: chromadb/chroma:1.5.9
    command: run --host 0.0.0.0 --port 8000 --path /data
    volumes:
      - chroma_data:/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Not published to the host — only the app and worker reach it over the
    # internal compose network. (Avoids clashing with any host-side redis on 6379.)
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  uploads_data:
  chroma_data:
  sqlite_data:
  redis_data:
