<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="DocuChunk tutor">
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1a33"/>
      <stop offset="1" stop-color="#040e1f"/>
    </linearGradient>
    <linearGradient id="tface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00C8FF"/>
      <stop offset="1" stop-color="#0055FF"/>
    </linearGradient>
    <radialGradient id="tglow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#00C8FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#00C8FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- backdrop -->
  <rect width="120" height="120" rx="28" fill="url(#tbg)"/>
  <circle cx="60" cy="58" r="42" fill="url(#tglow)"/>

  <!-- head / face plate -->
  <rect x="30" y="30" width="60" height="58" rx="20" fill="url(#tface)"/>
  <rect x="30" y="30" width="60" height="58" rx="20" fill="#ffffff" fill-opacity="0.06"/>

  <!-- antenna (little AI spark) -->
  <line x1="60" y1="30" x2="60" y2="18" stroke="#00C8FF" stroke-width="3" stroke-linecap="round"/>
  <circle cx="60" cy="15" r="4.5" fill="#8be9ff"/>

  <!-- eyes -->
  <circle cx="48" cy="56" r="6" fill="#ffffff"/>
  <circle cx="72" cy="56" r="6" fill="#ffffff"/>
  <circle cx="49" cy="57" r="2.6" fill="#0b1a33"/>
  <circle cx="73" cy="57" r="2.6" fill="#0b1a33"/>

  <!-- friendly smile -->
  <path d="M48 70 Q60 80 72 70" fill="none" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round"/>

  <!-- headset (assistant vibe) -->
  <path d="M26 60 A34 34 0 0 1 94 60" fill="none" stroke="#8be9ff" stroke-width="4" stroke-linecap="round"/>
  <rect x="22" y="58" width="9" height="16" rx="4.5" fill="#8be9ff"/>
  <rect x="89" y="58" width="9" height="16" rx="4.5" fill="#8be9ff"/>
  <!-- mic boom -->
  <path d="M89 74 Q84 86 74 86" fill="none" stroke="#8be9ff" stroke-width="3.2" stroke-linecap="round"/>
  <circle cx="72" cy="86" r="3.4" fill="#8be9ff"/>
</svg>
