<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DocuChunk — Reset Password</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <style>
    .auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; background: var(--bg-0); }
    .auth-card { background: var(--bg-card); border: 1px solid #222; border-radius: 12px; padding: 3rem 2.8rem; width: 100%; max-width: 420px; }
    .auth-logo  { font-size: 1.5rem; font-weight: 700; color: var(--gold); margin-bottom: .4rem; }
    .auth-logo span { color: var(--text-muted, #aaa); font-weight: 300; }
    .auth-sub   { color: #888; font-size: .9rem; margin-bottom: 2rem; line-height: 1.5; }
    .form-group { margin-bottom: 1.4rem; }
    .form-group label { display: block; font-size: .82rem; color: #aaa; margin-bottom: .45rem; letter-spacing: .03em; text-transform: uppercase; }
    .form-group input { width: 100%; padding: .75rem 1rem; background: #111; border: 1px solid #2a2a2a; border-radius: 7px; color: #eee; font-size: .95rem; outline: none; transition: border-color .2s; }
    .form-group input:focus { border-color: var(--gold); }
    .btn-primary { width: 100%; padding: .85rem; background: linear-gradient(135deg, var(--gold), #a0782e); border: none; border-radius: 7px; color: #000; font-weight: 700; font-size: 1rem; cursor: pointer; transition: opacity .2s; }
    .btn-primary:hover { opacity: .88; }
    .btn-primary:disabled { opacity: .45; cursor: not-allowed; }
    .back-link  { display: block; text-align: center; margin-top: 1.6rem; color: #666; font-size: .88rem; }
    .back-link a { color: var(--gold); text-decoration: none; }
    .back-link a:hover { text-decoration: underline; }
    .msg { border-radius: 7px; padding: .85rem 1rem; margin-bottom: 1.2rem; font-size: .9rem; display: none; }
    .msg.success { background: rgba(57,255,20,.08); border: 1px solid rgba(57,255,20,.25); color: #39FF14; }
    .msg.error   { background: rgba(255,80,80,.08); border: 1px solid rgba(255,80,80,.25); color: #ff5555; }
    .dev-box { background: #0d1a0d; border: 1px dashed #39FF1444; border-radius: 7px; padding: .9rem 1rem; margin-top: 1rem; display: none; }
    .dev-box p  { font-size: .75rem; color: #39FF14; margin-bottom: .4rem; font-family: monospace; }
    .dev-box a  { font-size: .8rem; color: var(--gold); word-break: break-all; }
    .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid rgba(0,0,0,.3); border-top-color: #000; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; margin-right: .5rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">Docu<span>Chunk</span></div>
    <p class="auth-sub">Enter your account email and we'll send you a link to reset your password.</p>

    <div class="msg" id="msg"></div>

    <form id="form" novalidate>
      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required />
      </div>
      <button type="submit" class="btn-primary" id="btn">Send Reset Link</button>
    </form>

    <!-- Dev mode: shows the reset link directly in the UI -->
    <div class="dev-box" id="dev-box">
      <p>⚡ DEV MODE — reset link (would be emailed in production):</p>
      <a id="dev-link" href="#"></a>
    </div>

    <p class="back-link"><a href="/login">← Back to Sign In</a></p>
  </div>
</div>

<script>
const form   = document.getElementById('form');
const btn    = document.getElementById('btn');
const msgEl  = document.getElementById('msg');
const devBox = document.getElementById('dev-box');
const devLink= document.getElementById('dev-link');

function showMsg(text, type) {
  msgEl.textContent = text;
  msgEl.className   = `msg ${type}`;
  msgEl.style.display = 'block';
}

form.addEventListener('submit', async e => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  if (!email) { showMsg('Please enter your email address.', 'error'); return; }

  btn.disabled   = true;
  btn.innerHTML  = '<span class="spinner"></span>Sending…';
  msgEl.style.display = 'none';
  devBox.style.display = 'none';

  try {
    const res  = await fetch('/auth/forgot-password', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ email }),
    });
    const data = await res.json();

    if (!res.ok) {
      showMsg(data.detail || 'Something went wrong.', 'error');
    } else {
      showMsg(data.message, 'success');
      form.style.display = 'none';

      // Only present in development mode — never in production
      if (data.reset_url) {
        devLink.textContent = data.reset_url;
        devLink.href        = data.reset_url;
        devBox.style.display = 'block';
      }
    }
  } catch {
    showMsg('Network error — please try again.', 'error');
  } finally {
    btn.disabled  = false;
    btn.textContent = 'Send Reset Link';
  }
});
</script>
</body>
</html>
