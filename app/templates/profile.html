<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile — DocuChunk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    :root, :root[data-theme="dark"] {
      --bg:#04070f; --bg-1:#070c18; --bg-2:#0c1220; --bg-card:#0f1826; --bg-hover:#131e2e;
      --b:rgba(30,90,180,0.22); --b-hi:rgba(0,170,255,0.4);
      --cyan:#00C8FF; --cyan-dim:rgba(0,200,255,0.09); --cyan-glow:rgba(0,200,255,0.18);
      --blue:#0055FF; --text:#D8E8FF; --text2:#6888AA; --text3:#2A4060;
      --green:#37E2A0; --red:#FF6B7D; --r:10px; --rl:16px;
    }
    :root[data-theme="light"] {
      --bg:#eef3fb; --bg-1:#ffffff; --bg-2:#f4f7fc; --bg-card:#ffffff; --bg-hover:#eaf1fb;
      --b:rgba(20,80,160,0.16); --b-hi:rgba(0,120,220,0.4);
      --cyan:#0091c8; --cyan-dim:rgba(0,145,200,0.10); --cyan-glow:rgba(0,145,200,0.15);
      --blue:#0055FF; --text:#0c1a2e; --text2:#546b86; --text3:#a7bad2;
      --green:#0a9d6e; --red:#d63a4e;
    }
    body { font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif; background:var(--bg); color:var(--text);
      -webkit-font-smoothing:antialiased; min-height:100vh; }
    svg { width:18px; height:18px; }
    button { font-family:inherit; cursor:pointer; }
    a { color:inherit; }

    .topnav { height:56px; border-bottom:1px solid var(--b); background:var(--bg-1); display:flex; align-items:center;
      gap:12px; padding:0 18px; position:sticky; top:0; z-index:10; }
    .back { display:flex; align-items:center; gap:8px; color:var(--text2); text-decoration:none; font-size:13px; }
    .back:hover { color:var(--cyan); }
    .logo-box { width:26px; height:26px; border-radius:7px; background:linear-gradient(135deg,var(--blue),var(--cyan));
      display:grid; place-items:center; color:#fff; font-weight:800; font-size:14px; }
    .spacer { flex:1; }
    .theme-btn { background:none; border:1px solid var(--b); color:var(--text2); border-radius:8px; width:34px; height:34px; display:grid; place-items:center; }
    .theme-btn:hover { color:var(--cyan); border-color:var(--b-hi); }

    .wrap { max-width:560px; margin:36px auto; padding:0 18px 60px; }
    .card { background:var(--bg-card); border:1px solid var(--b); border-radius:var(--rl); padding:30px 26px; text-align:center; }

    .avatar-big { width:104px; height:104px; border-radius:26px; margin:0 auto 8px; overflow:hidden; position:relative;
      border:2px solid var(--b-hi); cursor:pointer; background:var(--bg-2); }
    .avatar-big img { width:100%; height:100%; display:block; }
    .avatar-edit { position:absolute; inset:auto 0 0 0; background:rgba(0,0,0,.55); color:#fff; font-size:11px;
      padding:4px 0; display:flex; align-items:center; justify-content:center; gap:5px; }
    .name { font-size:21px; font-weight:700; margin-top:6px; }
    .email-row { display:flex; align-items:center; justify-content:center; gap:8px; color:var(--text2); font-size:14px; margin-top:5px; }
    .link-btn { background:none; border:none; color:var(--cyan); font-size:12.5px; font-weight:600; }
    .link-btn:hover { text-decoration:underline; }

    .section { text-align:left; margin-top:24px; border-top:1px solid var(--b); padding-top:20px; }
    .section h4 { font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--text2); margin-bottom:12px; }
    .field { margin-bottom:12px; }
    .field label { display:block; font-size:12px; color:var(--text2); margin-bottom:5px; }
    input[type=text], input[type=email], input[type=password] {
      width:100%; padding:10px 12px; background:var(--bg-2); border:1px solid var(--b); border-radius:var(--r);
      color:var(--text); font-family:inherit; font-size:14px; outline:none; }
    input:focus { border-color:var(--b-hi); }
    .btn-row { display:flex; gap:8px; margin-top:6px; }
    .btn { padding:9px 16px; border-radius:var(--r); font-size:13px; font-weight:600; border:1px solid var(--b); background:var(--bg-2); color:var(--text); }
    .btn.primary { background:var(--blue); border-color:var(--blue); color:#fff; }
    .btn.primary:hover { background:var(--cyan); border-color:var(--cyan); }
    .btn:hover { border-color:var(--b-hi); }
    .hidden { display:none; }
    .collapsed { display:none; }
    .revealer { width:100%; padding:11px; border:1px dashed var(--b); border-radius:var(--r); background:transparent;
      color:var(--text2); font-size:13px; display:flex; align-items:center; justify-content:center; gap:8px; }
    .revealer:hover { color:var(--cyan); border-color:var(--b-hi); }

    .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--bg-card);
      border:1px solid var(--green); color:var(--green); padding:11px 18px; border-radius:var(--r); font-size:13px;
      opacity:0; transition:.3s; z-index:50; pointer-events:none; }
    .toast.show { opacity:1; transform:translateX(-50%); }

    /* avatar picker modal */
    .overlay { position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:60; display:none; align-items:center; justify-content:center; padding:20px; }
    .overlay.show { display:flex; }
    .picker { width:440px; max-width:100%; background:var(--bg-card); border:1px solid var(--b); border-radius:var(--rl); padding:22px; }
    .picker h3 { font-size:16px; margin-bottom:4px; }
    .picker p { font-size:12.5px; color:var(--text2); margin-bottom:16px; }
    .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
    .opt { aspect-ratio:1; border-radius:16px; overflow:hidden; cursor:pointer; border:2px solid transparent; background:var(--bg-2); }
    .opt img { width:100%; height:100%; display:block; }
    .opt:hover { border-color:var(--b-hi); }
    .opt.selected { border-color:var(--cyan); box-shadow:0 0 0 3px var(--cyan-glow); }
    .picker-actions { display:flex; gap:8px; margin-top:18px; }
    .picker-actions .btn { flex:1; justify-content:center; text-align:center; }
    @media (max-width:520px){ .grid { grid-template-columns:repeat(3,1fr); } }
  </style>
</head>
<body>
  <div class="topnav">
    <a class="back" href="/chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg> Back to Chat</a>
    <div class="spacer"></div>
    <a class="back" href="/dashboard"><div class="logo-box">D</div></a>
    <button class="theme-btn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">
      <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>

  <div class="wrap">
    <div class="card">
      <!-- avatar -->
      <div class="avatar-big" id="avatarBig" title="Change avatar">
        <img id="avatarImg" src="/static/avatars/av-1.svg" alt="avatar"/>
        <div class="avatar-edit">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:12px;height:12px"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
          Edit
        </div>
      </div>

      <div class="name" id="displayName">Alex Rivera</div>
      <div class="email-row">
        <span id="displayEmail">alex@example.com</span>
        <button class="link-btn" id="editEmailBtn">Edit</button>
      </div>

      <!-- inline email edit -->
      <div class="section collapsed" id="emailEditor">
        <h4>Edit email</h4>
        <div class="field"><label>Email address</label><input type="email" id="emailInput" /></div>
        <div class="btn-row">
          <button class="btn primary" id="saveEmail">Save</button>
          <button class="btn" id="cancelEmail">Cancel</button>
        </div>
      </div>

      <!-- password -->
      <div class="section">
        <h4>Security</h4>
        <button class="revealer" id="pwReveal">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:15px;height:15px"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          Change Password
        </button>
        <div class="collapsed" id="pwEditor" style="margin-top:12px">
          <div class="field"><label>Current password</label><input type="password" id="pwCurrent" placeholder="••••••••"/></div>
          <div class="field"><label>New password</label><input type="password" id="pwNew" placeholder="At least 8 characters"/></div>
          <div class="field"><label>Confirm new password</label><input type="password" id="pwConfirm" placeholder="Repeat new password"/></div>
          <div class="btn-row">
            <button class="btn primary" id="savePw">Update password</button>
            <button class="btn" id="cancelPw">Cancel</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- avatar picker -->
  <div class="overlay" id="pickerOverlay">
    <div class="picker">
      <h3>Choose an avatar</h3>
      <p>Pick one of the built-in avatars. No upload needed.</p>
      <div class="grid" id="avatarGrid"></div>
      <div class="picker-actions">
        <button class="btn" id="pickerCancel">Cancel</button>
        <button class="btn primary" id="pickerSave">Save avatar</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">Saved</div>

<script>
/* Phase 1: all edits are LOCAL ONLY — console.log + localStorage (so the chat
   sidebar reflects them). Phase 2 wires these to /auth/me, PATCH email, and the
   change-password endpoint. */
const $ = (id) => document.getElementById(id);
const AVATAR_COUNT = 16;

/* theme */
(function(){ const t = localStorage.getItem('theme')||'dark'; document.documentElement.setAttribute('data-theme',t); setIcon(t); })();
function setIcon(t){ $('themeIcon').innerHTML = t==='dark'
  ? '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'
  : '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>'; }
$('themeBtn').onclick = () => { const n = document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',n); localStorage.setItem('theme',n); setIcon(n); };

/* load identity */
let selectedAvatar = localStorage.getItem('avatar') || '/static/avatars/av-1.svg';
$('avatarImg').src = selectedAvatar;
const savedName = localStorage.getItem('displayName'); if (savedName) $('displayName').textContent = savedName;
const savedEmail = localStorage.getItem('displayEmail'); if (savedEmail) $('displayEmail').textContent = savedEmail;

function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }

/* ── avatar picker ─────────────────────────────────────────────────────────── */
let pendingAvatar = selectedAvatar;
function buildGrid(){
  const g = $('avatarGrid'); g.innerHTML='';
  for (let i=1;i<=AVATAR_COUNT;i++){
    const path = `/static/avatars/av-${i}.svg`;
    const div = document.createElement('div');
    div.className = 'opt' + (path===pendingAvatar?' selected':'');
    div.innerHTML = `<img src="${path}" alt="avatar ${i}"/>`;
    div.onclick = () => { pendingAvatar = path; g.querySelectorAll('.opt').forEach(o=>o.classList.remove('selected')); div.classList.add('selected'); };
    g.appendChild(div);
  }
}
$('avatarBig').onclick = () => { pendingAvatar = selectedAvatar; buildGrid(); $('pickerOverlay').classList.add('show'); };
$('pickerCancel').onclick = () => $('pickerOverlay').classList.remove('show');
$('pickerOverlay').onclick = (e) => { if (e.target===$('pickerOverlay')) $('pickerOverlay').classList.remove('show'); };
$('pickerSave').onclick = () => {
  selectedAvatar = pendingAvatar;
  $('avatarImg').src = selectedAvatar;
  localStorage.setItem('avatar', selectedAvatar);           // Phase 2: PATCH /auth/me avatar
  console.log('[mock save] avatar =', selectedAvatar);
  $('pickerOverlay').classList.remove('show');
  toast('Avatar updated');
};

/* ── email inline edit ─────────────────────────────────────────────────────── */
$('editEmailBtn').onclick = () => {
  $('emailInput').value = $('displayEmail').textContent;
  $('emailEditor').classList.remove('collapsed');
};
$('cancelEmail').onclick = () => $('emailEditor').classList.add('collapsed');
$('saveEmail').onclick = () => {
  const v = $('emailInput').value.trim();
  if (!v || !v.includes('@')){ toast('Enter a valid email'); return; }
  $('displayEmail').textContent = v;
  localStorage.setItem('displayEmail', v);                   // Phase 2: PATCH /auth/me
  console.log('[mock save] email =', v);
  $('emailEditor').classList.add('collapsed');
  toast('Email updated');
};

/* ── change password ───────────────────────────────────────────────────────── */
$('pwReveal').onclick = () => $('pwEditor').classList.toggle('collapsed');
$('cancelPw').onclick = () => { $('pwEditor').classList.add('collapsed'); ['pwCurrent','pwNew','pwConfirm'].forEach(id=>$(id).value=''); };
$('savePw').onclick = () => {
  const cur=$('pwCurrent').value, nw=$('pwNew').value, cf=$('pwConfirm').value;
  if (!cur || !nw){ toast('Fill all fields'); return; }
  if (nw.length < 8){ toast('New password too short'); return; }
  if (nw !== cf){ toast('Passwords do not match'); return; }
  console.log('[mock save] password change requested', { current:'••••', new:'••••' }); // Phase 2: POST change-password
  ['pwCurrent','pwNew','pwConfirm'].forEach(id=>$(id).value='');
  $('pwEditor').classList.add('collapsed');
  toast('Password updated');
};
</script>
</body>
</html>
