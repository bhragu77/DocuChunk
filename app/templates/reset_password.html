<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DocuChunk — Choose New Password</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <style>
    .auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; background: var(--bg-0); }
    .auth-card { background: var(--bg-card); border: 1px solid #222; border-radius: 12px; padding: 3rem 2.8rem; width: 100%; max-width: 420px; }
    .auth-logo  { font-size: 1.5rem; font-weight: 700; color: var(--gold); margin-bottom: .4rem; }
    .auth-logo span { color: #aaa; font-weight: 300; }
    .auth-sub   { color: #888; font-size: .9rem; margin-bottom: 2rem; line-height: 1.5; }
    .form-group { margin-bottom: 1.4rem; position: relative; }
    .form-group label { display: block; font-size: .82rem; color: #aaa; margin-bottom: .45rem; letter-spacing: .03em; text-transform: uppercase; }
    .form-group input { width: 100%; padding: .75rem 3rem .75rem 1rem; background: #111; border: 1px solid #2a2a2a; border-radius: 7px; color: #eee; font-size: .95rem; outline: none; transition: border-color .2s; }
    .form-group input:focus { border-color: var(--gold); }
    .toggle-pw { position: absolute; right: .9rem; top: 2.4rem; cursor: pointer; color: #555; font-size: .85rem; user-select: none; }
    .toggle-pw:hover { color: var(--gold); }
    .strength-bar { height: 3px; border-radius: 2px; background: #222; margin-top: .4rem; overflow: hidden; }
    .strength-fill { height: 100%; width: 0; transition: width .3s, background .3s; border-radius: 2px; }
    .strength-hint { font-size: .75rem; color: #555; margin-top: .3rem; min-height: 1em; }
    .btn-primary { width: 100%; padding: .85rem; background: linear-gradient(135deg, var(--gold), #a0782e); border: none; border-radius: 7px; color: #000; font-weight: 700; font-size: 1rem; cursor: pointer; transition: opacity .2s; }
    .btn-primary:hover { opacity: .88; }
    .btn-primary:disabled { opacity: .45; cursor: not-allowed; }
    .back-link { display: block; text-align: center; margin-top: 1.6rem; color: #666; font-size: .88rem; }
    .back-link a { color: var(--gold); text-decoration: none; }
    .back-link a:hover { text-decoration: underline; }
    .msg { border-radius: 7px; padding: .85rem 1rem; margin-bottom: 1.2rem; font-size: .9rem; display: none; }
    .msg.success { background: rgba(57,255,20,.08); border: 1px solid rgba(57,255,20,.25); color: #39FF14; }
    .msg.error   { background: rgba(255,80,80,.08); border: 1px solid rgba(255,80,80,.25); color: #ff5555; }
    .invalid-state { text-align: center; padding: 1.5rem 0; display: none; }
    .invalid-state p { color: #ff5555; margin-bottom: 1rem; }
    .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid rgba(0,0,0,.3); border-top-color: #000; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; margin-right: .5rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">Docu<span>Chunk</span></div>
    <p class="auth-sub">Choose a strong new password for your account.</p>

    <div class="msg" id="msg"></div>

    <!-- Shown when token is missing/invalid before form submission -->
    <div class="invalid-state" id="invalid-state">
      <p>This reset link is invalid or has already been used.</p>
      <a href="/forgot-password" class="btn-primary" style="display:inline-block;padding:.75rem 1.6rem;text-decoration:none;">Request a new link</a>
    </div>

    <form id="form" novalidate>
      <div class="form-group">
        <label for="new-password">New password</label>
        <input type="password" id="new-password" placeholder="At least 8 characters" autocomplete="new-password" required />
        <span class="toggle-pw" id="toggle1">show</span>
        <div class="strength-bar"><div class="strength-fill" id="strength-fill"></div></div>
        <div class="strength-hint" id="strength-hint"></div>
      </div>
      <div class="form-group">
        <label for="confirm-password">Confirm new password</label>
        <input type="password" id="confirm-password" placeholder="Repeat your password" autocomplete="new-password" required />
        <span class="toggle-pw" id="toggle2">show</span>
      </div>
      <button type="submit" class="btn-primary" id="btn">Set New Password</button>
    </form>

    <p class="back-link"><a href="/login">← Back to Sign In</a></p>
  </div>
</div>

<script>
const token = new URLSearchParams(window.location.search).get('token');

// No token in URL — show the invalid state immediately
if (!token) {
  document.getElementById('form').style.display   = 'none';
  document.getElementById('invalid-state').style.display = 'block';
}

// ── Strength meter ────────────────────────────────────────────────────────
const pwInput = document.getElementById('new-password');
const fill    = document.getElementById('strength-fill');
const hint    = document.getElementById('strength-hint');

const STRENGTH_COLORS = ['#ff5555', '#ff5555', '#ffbd2e', '#39FF14', '#39FF14'];
const STRENGTH_LABELS = ['Too short', 'Weak', 'Fair', 'Strong', 'Very strong'];

function scorePassword(pw) {
  if (pw.length < 8)  return 0;
  let s = 1;
  if (pw.length >= 12)         s++;
  if (/[A-Z]/.test(pw))        s++;
  if (/[0-9]/.test(pw))        s++;
  if (/[^A-Za-z0-9]/.test(pw)) s++;
  return Math.min(s, 4);
}

pwInput.addEventListener('input', () => {
  const sc = scorePassword(pwInput.value);
  fill.style.width      = `${(sc / 4) * 100}%`;
  fill.style.background = STRENGTH_COLORS[sc];
  hint.textContent      = pwInput.value ? STRENGTH_LABELS[sc] : '';
  hint.style.color      = STRENGTH_COLORS[sc];
});

// ── Show/hide toggles ─────────────────────────────────────────────────────
function setupToggle(btnId, inputId) {
  const btn = document.getElementById(btnId);
  const inp = document.getElementById(inputId);
  btn.addEventListener('click', () => {
    inp.type = inp.type === 'password' ? 'text' : 'password';
    btn.textContent = inp.type === 'password' ? 'show' : 'hide';
  });
}
setupToggle('toggle1', 'new-password');
setupToggle('toggle2', 'confirm-password');

// ── Form submission ───────────────────────────────────────────────────────
const form  = document.getElementById('form');
const btn   = document.getElementById('btn');
const msgEl = document.getElementById('msg');

function showMsg(text, type) {
  msgEl.textContent   = text;
  msgEl.className     = `msg ${type}`;
  msgEl.style.display = 'block';
}

form.addEventListener('submit', async e => {
  e.preventDefault();
  const pw1 = document.getElementById('new-password').value;
  const pw2 = document.getElementById('confirm-password').value;

  if (pw1.length < 8)  { showMsg('Password must be at least 8 characters.', 'error'); return; }
  if (pw1 !== pw2)     { showMsg('Passwords do not match.', 'error'); return; }

  btn.disabled  = true;
  btn.innerHTML = '<span class="spinner"></span>Saving…';
  msgEl.style.display = 'none';

  try {
    const res  = await fetch('/auth/reset-password', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ token, new_password: pw1 }),
    });
    const data = await res.json();

    if (!res.ok) {
      showMsg(data.detail || 'Something went wrong.', 'error');
      if (res.status === 400) {
        // Token invalid/used — show the "request new link" state
        form.style.display = 'none';
        document.getElementById('invalid-state').style.display = 'block';
      }
    } else {
      showMsg(data.message + ' Redirecting to sign in…', 'success');
      form.style.display = 'none';
      setTimeout(() => { window.location.href = '/login'; }, 2200);
    }
  } catch {
    showMsg('Network error — please try again.', 'error');
  } finally {
    btn.disabled    = false;
    btn.textContent = 'Set New Password';
  }
});
</script>
</body>
</html>
